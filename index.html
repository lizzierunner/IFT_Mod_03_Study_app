<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EER Case Files — Module 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9E1C9;
    --surface:#FBF7EC;
    --surface-2:#F1E9D3;
    --ink:#221C14;
    --ink-soft:#5A5040;
    --accent:#B23A1A;
    --accent-soft:#D9C9A0;
    --gold:#9C7A1F;
    --good:#3C6B4A;
    --good-bg:#DCE9DE;
    --bad:#A23A2E;
    --bad-bg:#F1DCD6;
    --border:#CBB98F;
    --shadow: 2px 3px 0 rgba(34,28,20,0.15);
    --font-head:'Special Elite', 'Courier New', monospace;
    --font-body:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --bg:#171B22;
      --surface:#232A35;
      --surface-2:#1D242E;
      --ink:#EDE6D3;
      --ink-soft:#B4AB93;
      --accent:#E2703A;
      --accent-soft:#3A3223;
      --gold:#E3B93F;
      --good:#7FBE8F;
      --good-bg:#243329;
      --bad:#E48A79;
      --bad-bg:#3A2521;
      --border:#3B4452;
      --shadow: 2px 3px 0 rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171B22;
    --surface:#232A35;
    --surface-2:#1D242E;
    --ink:#EDE6D3;
    --ink-soft:#B4AB93;
    --accent:#E2703A;
    --accent-soft:#3A3223;
    --gold:#E3B93F;
    --good:#7FBE8F;
    --good-bg:#243329;
    --bad:#E48A79;
    --bad-bg:#3A2521;
    --border:#3B4452;
    --shadow: 2px 3px 0 rgba(0,0,0,0.4);
  }

  /* ---------- FUN MODE (ADHD-friendly high-energy theme) ---------- */
  body.fun-mode{
    --bg:#FFF4E0;
    --surface:#FFFFFF;
    --surface-2:#FFEFD6;
    --ink:#2B1055;
    --ink-soft:#7A5AC2;
    --accent:#FF3D7F;
    --accent-soft:#FFD9E8;
    --gold:#FFB800;
    --good:#00C48C;
    --good-bg:#D9FBEF;
    --bad:#FF5C5C;
    --bad-bg:#FFE5E5;
    --border:#FFB800;
    --shadow: 3px 4px 0 rgba(43,16,85,0.22);
  }
  body.fun-mode .card{border-width:3px;}
  body.fun-mode .tab.active{border-width:3px;}
  body.fun-mode button.btn.primary{background:linear-gradient(135deg,var(--accent),#FF9D3D);border-color:var(--accent);color:#fff;}
  body.fun-mode .brand .stamp{animation:wiggle 2.2s ease-in-out infinite;}
  body.fun-mode .progress-fill{background:linear-gradient(90deg,#FF3D7F,#FFB800,#00C48C);}
  @keyframes wiggle{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(10deg) scale(1.1);}}
  @media (prefers-reduced-motion: reduce){ body.fun-mode .brand .stamp{animation:none;} }

  /* tactile, satisfying button/option feedback */
  button.btn{transition:transform .12s ease, box-shadow .12s ease;}
  button.btn:active{transform:scale(0.92);}
  body.fun-mode button.btn:hover{transform:translateY(-3px) rotate(-1deg);}
  .opt{transition:transform .1s ease;}
  .opt:active{transform:scale(0.97);}
  .opt.correct{animation:correctPop .35s ease;}
  @keyframes correctPop{0%{transform:scale(1);}40%{transform:scale(1.03);}100%{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .opt.correct{animation:none;} }

  .chip.fire{color:var(--bad);border-color:var(--bad);}

  /* toast: quick dopamine-friendly praise popup */
  .toast{
    position:fixed;left:50%;bottom:26px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--surface);
    font-family:var(--font-head);font-size:0.82rem;
    padding:10px 18px;border-radius:30px;
    box-shadow:0 4px 14px rgba(0,0,0,0.28);
    opacity:0;pointer-events:none;z-index:1000;
    transition:opacity .25s ease, transform .25s ease;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(34,28,20,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }
  :root[data-theme="dark"] body, :root:not([data-theme="light"]) body {
    @media (prefers-color-scheme: dark){
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0);
    }
  }

  #app{max-width:920px;margin:0 auto;padding:18px 16px 60px;}

  /* ---------- HEADER ---------- */
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .stamp{
    width:40px;height:40px;flex:none;
    border:2px solid var(--accent);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);
    color:var(--accent);
  }
  .brand h1{
    font-family:var(--font-head);
    font-size:1.15rem;
    margin:0;
    line-height:1.15;
  }
  .brand p{margin:2px 0 0;font-size:0.78rem;color:var(--ink-soft);}

  .stats{display:flex;align-items:center;gap:10px;}
  .chip{
    font-family:var(--font-head);
    font-size:0.78rem;
    background:var(--surface);
    border:2px solid var(--ink);
    border-radius:4px;
    padding:5px 9px;
    box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .chip.xp{color:var(--gold);border-color:var(--gold);}
  .chip.streak{color:var(--accent);border-color:var(--accent);}
  button.theme-toggle{
    background:var(--surface);border:2px solid var(--ink);border-radius:4px;
    width:36px;height:36px;cursor:pointer;font-size:1rem;color:var(--ink);
    box-shadow:var(--shadow);
  }

  /* progress bar */
  .progress-wrap{margin-bottom:18px;}
  .progress-label{
    display:flex;justify-content:space-between;
    font-size:0.72rem;color:var(--ink-soft);margin-bottom:5px;
    font-family:var(--font-head);
  }
  .progress-track{
    height:12px;background:var(--surface-2);border:2px solid var(--ink);
    border-radius:8px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--accent);
    transition:width .4s ease;
  }

  /* ---------- NAV TABS ---------- */
  nav.tabs{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;
    -webkit-overflow-scrolling:touch;
  }
  nav.tabs::-webkit-scrollbar{height:6px;}
  .tab{
    flex:none;
    font-family:var(--font-head);
    font-size:0.74rem;
    padding:8px 12px;
    background:var(--surface-2);
    border:2px solid var(--border);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;
  }
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex:none;}
  .tab.done .dot{background:var(--good);}
  .tab.active{
    background:var(--surface);
    border-color:var(--ink);
    color:var(--ink);
    box-shadow:0 2px 0 var(--surface);
  }

  /* ---------- CARD ---------- */
  .card{
    background:var(--surface);
    border:2px solid var(--ink);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:22px;
    animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
  }

  .case-tag{
    display:inline-block;
    font-family:var(--font-head);
    font-size:0.7rem;
    color:var(--accent);
    border:1px dashed var(--accent);
    padding:3px 8px;
    border-radius:20px;
    margin-bottom:10px;
  }
  h2.case-title{
    font-family:var(--font-head);
    font-size:1.4rem;
    margin:0 0 6px;
    line-height:1.25;
  }
  p.tagline{color:var(--ink-soft);margin:0 0 18px;font-size:0.92rem;}

  .briefing p{
    font-size:0.98rem;
    line-height:1.55;
    margin:0 0 12px;
  }
  .briefing strong{color:var(--accent);}

  .diagram-box{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    margin:16px 0;
    overflow-x:auto;
  }
  .diagram-box svg{display:block;margin:0 auto;max-width:100%;height:auto;}

  .evidence{
    background:var(--surface-2);
    border-left:4px solid var(--gold);
    border-radius:0 8px 8px 0;
    padding:12px 16px;
    margin:16px 0;
  }
  .evidence h4{
    margin:0 0 8px;font-family:var(--font-head);font-size:0.82rem;color:var(--gold);
  }
  .evidence ul{margin:0;padding-left:18px;font-size:0.9rem;line-height:1.6;}

  /* quiz */
  .quiz-box{margin-top:20px;padding-top:16px;border-top:2px dashed var(--border);}
  .quiz-q{font-weight:600;margin-bottom:12px;font-size:0.98rem;}
  .opt{
    display:block;width:100%;text-align:left;
    background:var(--surface);
    border:2px solid var(--border);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:8px;
    font-family:var(--font-body);
    font-size:0.92rem;
    cursor:pointer;
    color:var(--ink);
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:600;}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600;}
  .opt[disabled]{cursor:default;}
  .feedback{
    margin-top:12px;padding:10px 14px;border-radius:8px;font-size:0.88rem;display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:var(--good-bg);color:var(--good);}
  .feedback.bad{background:var(--bad-bg);color:var(--bad);}

  .nav-buttons{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:22px;gap:10px;flex-wrap:wrap;
  }
  button.btn{
    font-family:var(--font-head);
    font-size:0.82rem;
    padding:10px 18px;
    border-radius:8px;
    border:2px solid var(--ink);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  button.btn.primary{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  button.btn:disabled{opacity:0.4;cursor:not-allowed;}
  button.btn.ghost{box-shadow:none;background:transparent;}

  /* home */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px;}
  .home-card{
    background:var(--surface-2);border:2px solid var(--border);border-radius:10px;
    padding:16px;cursor:pointer;transition:border-color .15s;
  }
  .home-card:hover{border-color:var(--accent);}
  .home-card.done{border-color:var(--good);}
  .home-card .num{font-family:var(--font-head);color:var(--accent);font-size:0.75rem;}
  .home-card h3{margin:6px 0 4px;font-size:1rem;font-family:var(--font-head);}
  .home-card p{margin:0;font-size:0.82rem;color:var(--ink-soft);}
  .home-card .check{float:right;color:var(--good);font-weight:800;display:none;}
  .home-card.done .check{display:inline;}

  /* flashcards */
  .flash-stage{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:10px;}
  .flash-count{font-family:var(--font-head);font-size:0.78rem;color:var(--ink-soft);}
  .flashcard{
    width:100%;max-width:480px;height:230px;
    perspective:1200px;
    cursor:pointer;
  }
  .flash-inner{
    position:relative;width:100%;height:100%;
    transition:transform .5s;transform-style:preserve-3d;
  }
  .flashcard.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border:2px solid var(--ink);border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:20px;
    box-shadow:var(--shadow);
    background:var(--surface);
    font-size:1.05rem;
  }
  .flash-face.back{
    transform:rotateY(180deg);
    background:var(--accent-soft);
    font-size:0.95rem;
    line-height:1.5;
  }
  .flash-label{
    position:absolute;top:10px;left:14px;
    font-family:var(--font-head);font-size:0.65rem;color:var(--ink-soft);
  }
  .flash-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  /* final quiz result */
  .result-hero{text-align:center;padding:20px 0;}
  .result-hero .big{font-family:var(--font-head);font-size:2.6rem;color:var(--accent);}
  .paw-row{display:flex;justify-content:center;gap:6px;margin:14px 0;flex-wrap:wrap;}
  .paw{font-size:1.4rem;opacity:0.25;}
  .paw.on{opacity:1;}

  .empty-note{font-size:0.85rem;color:var(--ink-soft);margin-top:10px;}

  /* timer widget */
  .timer-bar{
    display:flex;align-items:center;gap:10px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:8px 12px;margin-bottom:16px;font-size:0.85rem;
  }
  .timer-bar .time{font-family:var(--font-head);font-size:1rem;color:var(--accent);min-width:52px;}
  .timer-bar button{
    background:var(--surface);border:1px solid var(--ink);border-radius:6px;
    font-size:0.75rem;padding:5px 10px;cursor:pointer;color:var(--ink);
  }

  footer.note{
    text-align:center;font-size:0.72rem;color:var(--ink-soft);margin-top:30px;
  }

  @media (max-width:520px){
    h2.case-title{font-size:1.15rem;}
    .card{padding:16px;}
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="stamp">🐾</div>
      <div>
        <h1>EER Case Files</h1>
        <p>IFT 200 · Module 3, Ch. 4 — Enhanced Entity-Relationship Model</p>
      </div>
    </div>
    <div class="stats">
      <span class="chip xp" id="xpChip">⭐ 0 XP</span>
      <span class="chip streak" id="doneChip">📁 0/7 closed</span>
      <span class="chip fire" id="streakChip">🔥 1 day streak</span>
      <button class="theme-toggle" id="funToggle" title="Toggle Fun Mode" aria-label="Toggle fun mode">🎉</button>
      <button class="theme-toggle" id="soundToggle" title="Toggle sound effects" aria-label="Toggle sound effects">🔔</button>
      <button class="theme-toggle" id="themeToggle" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-label"><span>CASE PROGRESS</span><span id="progressPct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="timer-bar">
    <span>⏱️ Focus sprint:</span>
    <span class="time" id="timerDisplay">5:00</span>
    <button id="timerStart">Start</button>
    <button id="timerReset">Reset</button>
    <span style="color:var(--ink-soft);font-size:0.78rem;">one file at a time — no rush</span>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <main id="main"></main>

  <footer class="note">Built from your IFT 200 Module 3 notes &amp; slides · Deputy Weezer approves this study session 🐶</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- DATA ---------------- */
  var CASES = [
    {
      id:"c1", num:"File #1", title:"Subclasses & Superclasses",
      tagline:"Every employee is a suspect... but some have specialties.",
      briefing:[
        "An entity like <strong>EMPLOYEE</strong> can be split into meaningful sub-groups, each with its own extra attributes. Secretary, Engineer, and Technician are <strong>subclasses</strong> of EMPLOYEE.",
        "EMPLOYEE is the <strong>superclass</strong> — the shared source all of them are drawn from. This superclass/subclass link is called the <strong>IS-A relationship</strong>: a Secretary IS-A(n) Employee.",
        "Golden rule: any record belonging to a subclass <strong>must also belong to its superclass</strong>, holding values for both. A superclass record doesn't have to belong to any subclass at all."
      ],
      diagram:"employee",
      evidence:[
        "Superclass = EMPLOYEE (Name, SSN, Birth_date, Address)",
        "Subclasses = SECRETARY, ENGINEER, TECHNICIAN (each adds its own attribute)",
        "IS-A relationship: Secretary IS-A Employee",
        "A record can belong to several subclasses at once (e.g. an engineer who is also a manager)"
      ],
      quiz:{
        q:"A SECRETARY record in the database must include:",
        options:[
          "Only the Typing_speed attribute",
          "Name, SSN, Birth_date, Salary — PLUS Typing_speed",
          "Nothing — subclasses store no data themselves",
          "Only attributes shared by every other subclass too"
        ],
        correct:1,
        explain:"Right — a subclass record holds every superclass attribute AND its own extra ones. That's the whole point of the IS-A link."
      }
    },
    {
      id:"c2", num:"File #2", title:"Inheritance Rules",
      tagline:"What gets passed down — and what doesn't.",
      briefing:[
        "A subclass inherits <strong>everything</strong> from its superclass: all attributes, and all relationships.",
        "Example: SECRETARY inherits Name, SSN, Birth_date and Salary from EMPLOYEE. If EMPLOYEE has a Works_For relationship to DEPARTMENT, every SECRETARY record keeps that too.",
        "But it's a one-way street: the <strong>superclass never inherits from its subclasses</strong>. And a subclass can still have its own private attributes or relationships that its siblings don't share — e.g. only HOURLY_EMPLOYEE connects to BELONGS_TO / TRADE_UNION."
      ],
      diagram:"inheritance",
      evidence:[
        "Subclass inherits ALL attributes + relationships of its superclass",
        "Superclass inherits NOTHING from any subclass",
        "A subclass may also have its own extra attributes/relationships, unique to it"
      ],
      quiz:{
        q:"True or false: an EMPLOYEE record (just the superclass, no subclass) automatically has a Typing_speed value, since SECRETARY has one.",
        options:["True — inheritance flows both ways", "False — inheritance only flows superclass → subclass"],
        correct:1,
        explain:"Correct. Typing_speed belongs to SECRETARY only. It never flows upward to plain EMPLOYEE records."
      }
    },
    {
      id:"c3", num:"File #3", title:"Specialization & Generalization",
      tagline:"Two directions of the same investigation.",
      briefing:[
        "<strong>Specialization</strong> works top-down: you start with a superclass and define subclasses inside it (EMPLOYEE ➜ {Secretary, Engineer, Technician}).",
        "<strong>Generalization</strong> works bottom-up: you start with separate entities that share attributes and merge them into one superclass. CAR and TRUCK both have Vehicle_id, Price, License_plate_no — so they generalize into VEHICLE.",
        "Specializations come in three flavors: <strong>attribute-defined</strong> (based on a Job_type value), <strong>predicate-defined</strong> (based on a condition across multiple attributes), and <strong>user-defined</strong> (the designer just decides)."
      ],
      diagram:"vehicle",
      evidence:[
        "Specialization = top-down (superclass → subclasses)",
        "Generalization = bottom-up (entities → shared superclass)",
        "Attribute-defined · Predicate-defined · User-defined specialization"
      ],
      quiz:{
        q:"CAR and TRUCK are merged into a new VEHICLE superclass because they share attributes. This process is:",
        options:["Specialization","Generalization","Categorization","Disjointness"],
        correct:1,
        explain:"Yes — combining existing entities upward into one shared superclass is generalization."
      }
    },
    {
      id:"c4", num:"File #4", title:"Constraints: Disjoint & Complete",
      tagline:"Can a suspect have two identities at once?",
      briefing:[
        "<strong>Disjointness constraint</strong> — Disjoint (marked <strong>d</strong>): a record can be in at most ONE subclass. Overlapping (marked <strong>o</strong>): a record can be in more than one subclass at the same time.",
        "<strong>Completeness constraint</strong> — Total (double line): every superclass record MUST belong to some subclass. Partial (single line): records may belong to none of the subclasses.",
        "Combine both and you get four flavors: disjoint-total, disjoint-partial, overlapping-total, overlapping-partial. Example: EMPLOYEE ➜ {Salaried, Hourly} is disjoint AND total — every employee is exactly one, never both, never neither."
      ],
      diagram:"constraints",
      evidence:[
        "d = disjoint (member of at most one subclass)",
        "o = overlapping (member of more than one subclass allowed)",
        "Double line = total (every record must belong to a subclass)",
        "Single line = partial (some records belong to none)"
      ],
      quiz:{
        q:"Every employee is either SALARIED or HOURLY — never both, never neither. This is:",
        options:["Disjoint, Total","Overlapping, Total","Disjoint, Partial","Overlapping, Partial"],
        correct:0,
        explain:"Exactly — 'never both' = disjoint (d), 'never neither' = total (double line)."
      }
    },
    {
      id:"c5", num:"File #5", title:"Categories (Union Types)",
      tagline:"The is-either-or relationship.",
      briefing:[
        "Sometimes a subclass needs to inherit from <strong>exactly one</strong> superclass out of a set — not all of them at once. That's a <strong>category</strong>, also called a union type, marked with a <strong>U</strong> in the diagram.",
        "Classic example: in a vehicle registration database, OWNER can be a PERSON, a BANK, or a COMPANY — but any single owner record is only ever ONE of those three, never a blend.",
        "Compare this to specialization: in specialization, a record can belong to several subclasses of the SAME superclass. In a category, the record picks exactly one superclass from a DIFFERENT set of superclasses."
      ],
      diagram:"category",
      evidence:[
        "Category = subclass inherits from exactly one of several superclasses",
        "Marked with U (union) in the EER diagram",
        "Example: OWNER = PERSON, BANK, or COMPANY (never more than one)"
      ],
      quiz:{
        q:"OWNER can be a PERSON, BANK, or COMPANY, but only ever one of the three per record. This is modeled as a:",

  function esc(s){return String(s);}
  function svgWrap(w,h,inner){

  function box(x,y,w,h,text_,strong){

  }

      '<text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" style="stroke:none;fill:var(--ink-soft);font-family:var(--font-body);font-size:10px;">'+text_+'</text>';

  var VIEWS = CASES.map(function(c){return c.id;}).concat(["flash","final"]);

  var STORE_KEY = "eer-case-files-progress-v1";

  var ENCOURAGE = ['Nice work! 🎉','Boom! 🎯','You got this! 💪','Brain gains! 🧠✨','Keep going, detective! 🕵️','One step closer! 👣','Great catch! 🔍','On fire! 🔥','Yes! Exactly right! ✅','Smooth work! 😎'];
  function randomEncourage(){ return ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)]; }

  function showToast(msg){
    var el = document.getElementById('toast');
    if(!el){
      el = document.createElement('div');
      el.id = 'toast'; el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove('show'); }, 1700);
  }

  var audioCtx = null;
  function getCtx(){
    if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    return audioCtx;
  }
  function playTone(freq, duration, type){
    if(!state.soundOn) return;
    try{
      var ctx = getCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type||'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.16, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime+duration);
    }catch(e){ /* audio unsupported, fail silently */ }
  }
  function soundCorrect(){ playTone(880,0.15); setTimeout(function(){playTone(1175,0.18);},100); }
  function soundWrong(){ playTone(190,0.22,'triangle'); }
  function soundReward(){ playTone(660,0.12); setTimeout(function(){playTone(880,0.12);},90); setTimeout(function(){playTone(1320,0.22);},180); }

  function updateStreak(){
    var today = new Date().toDateString();
    if(state.lastVisit !== today){
      var y = new Date(); y.setDate(y.getDate()-1);
      state.streak = (state.lastVisit === y.toDateString()) ? (state.streak||0)+1 : 1;
      state.lastVisit = today;
      saveState();
    }
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        state = Object.assign(state, parsed);
      }
    }catch(e){ /* fresh start */ }
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
  }

  /* ---------------- RENDER: SHELL ---------------- */
  var mainEl = document.getElementById('main');
  var tabsEl = document.getElementById('tabs');

  function totalFiles(){ return CASES.length; }
  function doneCount(){ return Object.keys(state.completed).filter(function(k){return state.completed[k];}).length; }

  function updateHeader(){
    document.getElementById('xpChip').textContent = '⭐ ' + state.xp + ' XP';
    document.getElementById('doneChip').textContent = '📁 ' + doneCount() + '/' + totalFiles() + ' closed';
    document.getElementById('streakChip').textContent = '🔥 ' + (state.streak||1) + ' day streak';
    var pct = Math.round((doneCount()/totalFiles())*100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
  }

  function renderTabs(){
    var html = '';
    CASES.forEach(function(c){
      var active = state.current===c.id ? ' active':'';
      var done = state.completed[c.id] ? ' done':'';
      html += '<div class="tab'+active+done+'" data-view="'+c.id+'"><span class="dot"></span>'+c.num+'</div>';
    });
    html += '<div class="tab'+(state.current==='flash'?' active':'')+'" data-view="flash"><span class="dot" style="background:var(--gold)"></span>Flashcards</div>';
    var finalDone = state.quizBest>0 ? ' done':'';
    html += '<div class="tab'+(state.current==='final'?' active':'')+finalDone+'" data-view="final"><span class="dot"></span>Case Closed Quiz</div>';
    tabsEl.innerHTML = html;
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function(el){
      el.addEventListener('click', function(){ goTo(el.getAttribute('data-view')); });
    });
  }

  function goTo(view){
    state.current = view;
    saveState();
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function render(){
    renderTabs();
    updateHeader();
    var c = CASES.find(function(x){return x.id===state.current;});
    if(c){ renderCase(c); }
    else if(state.current==='flash'){ renderFlash(); }
    else if(state.current==='final'){ renderFinal(); }
  }

  /* ---------------- RENDER: CASE FILE ---------------- */
  function renderCase(c){
    var idx = CASES.indexOf(c);
    var briefingHtml = c.briefing.map(function(p){return '<p>'+p+'</p>';}).join('');
    var evidenceHtml = c.evidence.map(function(e){return '<li>'+e+'</li>';}).join('');
    var already = !!state.completed[c.id];

    mainEl.innerHTML =
      '<div class="card">'+
        '<span class="case-tag">'+c.num+' of '+totalFiles()+'</span>'+
        '<h2 class="case-title">'+c.title+'</h2>'+
        '<p class="tagline">'+c.tagline+'</p>'+
        '<div class="briefing">'+briefingHtml+'</div>'+
        '<div class="diagram-box">'+DIAGRAMS[c.diagram]()+'</div>'+
        '<div class="evidence"><h4>Key evidence</h4><ul>'+evidenceHtml+'</ul></div>'+
        '<div class="quiz-box">'+
          '<div class="quiz-q">🔍 Quick check: '+c.quiz.q+'</div>'+
          '<div id="optWrap"></div>'+
          '<div class="feedback" id="feedback"></div>'+
        '</div>'+
        '<div class="nav-buttons">'+
          '<button class="btn ghost" id="prevBtn" '+(idx===0?'disabled':'')+'>← Previous file</button>'+
          '<button class="btn primary" id="closeBtn" '+(already?'disabled':'')+'>'+(already?'✓ File closed':'Close this file (+15 XP)')+'</button>'+
          '<button class="btn ghost" id="nextBtn" '+(idx===CASES.length-1?'disabled':'')+'>Next file →</button>'+
        '</div>'+
      '</div>';

    var optWrap = document.getElementById('optWrap');
    var answered = false;
    c.quiz.options.forEach(function(opt, i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.textContent = opt;
      b.addEventListener('click', function(){
        if(answered) return;
        answered = true;
        var buttons = optWrap.querySelectorAll('.opt');
        buttons.forEach(function(x){x.setAttribute('disabled','');});
        var fb = document.getElementById('feedback');
        if(i===c.quiz.correct){
          b.classList.add('correct');
          fb.className = 'feedback show good';
          fb.textContent = '✅ ' + c.quiz.explain;
          soundCorrect();
          showToast(randomEncourage());
        } else {
          b.classList.add('wrong');
          buttons[c.quiz.correct].classList.add('correct');
          fb.className = 'feedback show bad';
          fb.textContent = '❌ Not quite — ' + c.quiz.explain;
          soundWrong();
        }
      });
      optWrap.appendChild(b);
    });

    document.getElementById('closeBtn').addEventListener('click', function(){
      if(!state.completed[c.id]){
        state.completed[c.id] = true;
        state.xp += 15;
        saveState();
        celebrate();
        soundReward();
        showToast('File closed! +15 XP ⭐');
        render();
      }
    });
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    if(prevBtn && idx>0) prevBtn.addEventListener('click', function(){ goTo(CASES[idx-1].id); });
    if(nextBtn && idx<CASES.length-1) nextBtn.addEventListener('click', function(){ goTo(CASES[idx+1].id); });
  }

  /* ---------------- RENDER: FLASHCARDS ---------------- */

    mainEl.innerHTML =
      '<div class="card">'+
        '<span class="case-tag">Evidence Deck</span>'+
        '<h2 class="case-title">Flashcard Review</h2>'+

          '<div class="flash-count">Card '+(state.flashIdx+1)+' / '+FLASHCARDS.length+' &nbsp;·&nbsp; '+knownCount+' mastered</div>'+

          '</div>'+

          '</div>'+

    function advance(){
      state.flashIdx = (state.flashIdx+1) % FLASHCARDS.length;

    document.getElementById('flashPrev').addEventListener('click', function(e){
      e.stopPropagation();

            '<div class="big">'+finalRun.score+' / '+FINAL_QUIZ.length+'</div>'+
            '<p style="color:var(--ink-soft);margin-top:4px;">'+verdict+'</p>'+
            '<div class="paw-row">'+paws+'</div>'+
          '</div>'+
          '<div class="nav-buttons"><span></span>'+
            '<button class="btn primary" id="retryFinal">Try again</button>'+
            '<button class="btn ghost" id="backHomeBtn">Back to case files</button>'+
          '</div>'+
        '</div>';
      document.getElementById('retryFinal').addEventListener('click', startFinal);
      document.getElementById('backHomeBtn').addEventListener('click', function(){ finalRun=null; goTo(CASES[0].id); });
      celebrate();
      soundReward();
      showToast(pct>=85 ? 'Case closed! Amazing! 🏆' : 'Nice run! 🎉');
      return;
    }

    var q = FINAL_QUIZ[finalRun.i];
    mainEl.innerHTML =
      '<div class="card">'+
        '<span class="case-tag">Question '+(finalRun.i+1)+' of '+FINAL_QUIZ.length+'</span>'+
        '<h2 class="case-title" style="font-size:1.1rem;">'+q.q+'</h2>'+
        '<div id="optWrap" style="margin-top:14px;"></div>'+
        '<div class="feedback" id="feedback"></div>'+
        '<div class="nav-buttons"><span></span><button class="btn primary" id="nextQ" disabled>Next question →</button><span></span></div>'+
      '</div>';

    var optWrap = document.getElementById('optWrap');
    q.options.forEach(function(opt,i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.textContent = opt;
      b.addEventListener('click', function(){
        if(finalRun.answered) return;
        finalRun.answered = true;
        var buttons = optWrap.querySelectorAll('.opt');
        buttons.forEach(function(x){x.setAttribute('disabled','');});
        var fb = document.getElementById('feedback');
        if(i===q.correct){
          b.classList.add('correct');
          finalRun.score++;
          fb.className='feedback show good'; fb.textContent='✅ Correct.';
          soundCorrect();
          showToast(randomEncourage());
        } else {
          b.classList.add('wrong');
          buttons[q.correct].classList.add('correct');
          fb.className='feedback show bad'; fb.textContent='❌ The correct answer is highlighted above.';
          soundWrong();
        }
        document.getElementById('nextQ').removeAttribute('disabled');
      });
      optWrap.appendChild(b);
    });
    document.getElementById('nextQ').addEventListener('click', function(){
      finalRun.i++; finalRun.answered = false; render();
    });
  }

  /* ---------------- LITTLE CELEBRATION ---------------- */
  function celebrate(){
    var wrap = document.createElement('div');
    wrap.style.position='fixed'; wrap.style.inset='0'; wrap.style.pointerEvents='none'; wrap.style.zIndex='999';
    document.body.appendChild(wrap);
    var emojis = state.funMode ? ['🐾','⭐','🔎','🎉','✨','🎊','💥'] : ['🐾','⭐','🔎'];
    var pieces = state.funMode ? 24 : 14;
    for(var i=0;i<pieces;i++){
      var s = document.createElement('span');
      s.textContent = emojis[i%emojis.length];
      s.style.position='absolute';
      s.style.left = (10+Math.random()*80)+'%';
      s.style.top = '-30px';
      s.style.fontSize = (14+Math.random()*14)+'px';
      s.style.transition = 'transform 1.1s ease-in, opacity 1.1s ease-in';
      wrap.appendChild(s);
      (function(el){
        requestAnimationFrame(function(){
          el.style.transform = 'translateY('+(300+Math.random()*260)+'px) rotate('+(Math.random()*360)+'deg)';
          el.style.opacity = '0';
        });
      })(s);
    }
    setTimeout(function(){ wrap.remove(); }, 1300);
  }

  /* ---------------- TIMER (optional focus sprint) ---------------- */
  var timerSeconds = 300, timerRunning = false, timerHandle = null;
  function renderTimer(){
    var m = Math.floor(timerSeconds/60), s = timerSeconds%60;
    document.getElementById('timerDisplay').textContent = m+':'+(s<10?'0':'')+s;
  }
  document.getElementById('timerStart').addEventListener('click', function(){
    timerRunning = !timerRunning;
    this.textContent = timerRunning ? 'Pause' : 'Start';
    if(timerRunning){
      timerHandle = setInterval(function(){
        if(timerSeconds>0){ timerSeconds--; renderTimer(); }
        else{
          clearInterval(timerHandle);
          timerRunning = false;
          document.getElementById('timerStart').textContent='Start';
          celebrate();
        }
      },1000);
    } else {
      clearInterval(timerHandle);
    }
  });
  document.getElementById('timerReset').addEventListener('click', function(){
    clearInterval(timerHandle); timerRunning=false; timerSeconds=300;
    document.getElementById('timerStart').textContent='Start';
    renderTimer();
  });

  /* ---------------- THEME TOGGLE ---------------- */
  document.getElementById('themeToggle').addEventListener('click', function(){
    var root = document.documentElement;
    var current = root.getAttribute('data-theme');
    if(current==='dark'){ root.setAttribute('data-theme','light'); }
    else if(current==='light'){ root.removeAttribute('data-theme'); }
    else { root.setAttribute('data-theme','dark'); }
  });

  /* ---------------- FUN MODE TOGGLE ---------------- */
  var funBtn = document.getElementById('funToggle');
  function applyFunMode(){
    document.body.classList.toggle('fun-mode', state.funMode);
    funBtn.setAttribute('aria-pressed', state.funMode);
    funBtn.style.opacity = state.funMode ? '1' : '0.55';
  }
  funBtn.addEventListener('click', function(){
    state.funMode = !state.funMode;
    saveState();
    applyFunMode();
    if(state.funMode){ soundReward(); showToast('Fun Mode ON 🎉'); }
  });

  /* ---------------- SOUND TOGGLE ---------------- */
  var soundBtn = document.getElementById('soundToggle');
  function applySoundIcon(){
    soundBtn.textContent = state.soundOn ? '🔔' : '🔕';
    soundBtn.setAttribute('aria-pressed', state.soundOn);
  }
  soundBtn.addEventListener('click', function(){
    state.soundOn = !state.soundOn;
    saveState();
    applySoundIcon();
    if(state.soundOn){ soundCorrect(); }
  });

  /* ---------------- INIT ---------------- */
  loadState();
  if(VIEWS.indexOf(state.current)===-1){ state.current = CASES[0].id; }
  updateStreak();
  applyFunMode();
  applySoundIcon();
  renderTimer();
  render();

})();
</script>
</body>
</html>
